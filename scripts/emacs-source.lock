# Emacs source lock. Both local builds and CI load this file.
# REVISION is the commit that the upstream annotated tag
# EMACS_SOURCE_RELEASE_TAG points at, so this is the Emacs 31.1 release
# source rather than a mid-development snapshot. It is pinned by full SHA
# so that a moved or deleted upstream tag cannot change what we build.
readonly EMACS_SOURCE_REPOSITORY="https://github.com/emacs-mirror/emacs.git"
readonly EMACS_SOURCE_REVISION="a360712c9d272d950d8d8255ef74570f7e90b7d9"
readonly EMACS_SOURCE_SERIES="31"
readonly EMACS_SOURCE_RELEASE_TAG="emacs-31.1"
readonly EMACS_SOURCE_RELEASE_NAME="Emacs 31.1"
# The build of that source this repository publishes. Bump it by hand when
# the patch set, the configure arguments or a dependency changes: the release
# is tagged emacs-<version>-bendmacs.<N>, a published tag is never moved, and
# CI refuses to build a number whose tag already exists.
readonly EMACS_BUILD_NUMBER="4"
