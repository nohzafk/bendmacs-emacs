name: MacOS Build for GNU Emacs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        # Fail fast: -e halts on any error, -u catches unset vars,
        # -o pipefail propagates errors through pipes, -x echoes commands.
        # Without this, curl/tar failures silently cascade into confusing
        # `patch: File to patch:` prompts several steps later.
        shell: bash -euxo pipefail {0}
    env:
      # --fail: non-zero on HTTP 4xx/5xx (otherwise mirror error pages
      #   silently land as 166-byte "tarballs").
      # --retry 5 --retry-delay 5: paper over flaky GNU ftp mirrors.
      CURL_OPTS: "--fail --retry 5 --retry-delay 5 --location"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Load Emacs source lock
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-source.sh"
          printf '%s\n' "EMACS_SOURCE_LABEL=$EMACS_SOURCE_LABEL" \
            "EMACS_SOURCE_DIR=$EMACS_SOURCE_DIR" "EMACS_ARTIFACT=$EMACS_ARTIFACT" \
            "EMACS_RELEASE_TAG=$EMACS_RELEASE_TAG" \
            "EMACS_RELEASE_NAME=$EMACS_RELEASE_NAME" >> "$GITHUB_ENV"
      - name: Uninstall Homebrew
        run: |
          curl $CURL_OPTS -O https://raw.githubusercontent.com/Homebrew/install/HEAD/uninstall.sh
          sudo chmod +x uninstall.sh
          sudo env NONINTERACTIVE=1 ./uninstall.sh
          sudo rm -rf /opt/homebrew
          export PATH=''
          eval $(/usr/libexec/path_helper -s)
      - name: Install GNU M4
        run: |
          curl $CURL_OPTS -O https://ftpmirror.gnu.org/gnu/m4/m4-1.4.21.tar.xz
          tar -Jxf m4-1.4.21.tar.xz && cd m4-1.4.21
          ./configure && make -j4
          sudo make install
      - name: Install GNU Autoconf
        run: |
          curl $CURL_OPTS -O https://ftpmirror.gnu.org/gnu/autoconf/autoconf-2.72.tar.xz
          tar -Jxf autoconf-2.72.tar.xz && cd autoconf-2.72
          ./configure && make -j4
          sudo make install
      - name: Install GNU Automake
        run: |
          curl $CURL_OPTS -O https://ftpmirror.gnu.org/gnu/automake/automake-1.18.tar.xz
          tar -Jxf automake-1.18.tar.xz && cd automake-1.18
          ./configure && make -j4
          sudo make install
      - name: Install GNU Libtool
        run: |
          curl $CURL_OPTS -O https://ftpmirror.gnu.org/gnu/libtool/libtool-2.5.4.tar.xz
          tar -Jxf libtool-2.5.4.tar.xz && cd libtool-2.5.4
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install Pkgconf
        run: |
          curl $CURL_OPTS -O https://github.com/pkgconf/pkgconf/archive/refs/tags/pkgconf-2.5.1.tar.gz
          tar -zxf pkgconf-2.5.1.tar.gz && cd pkgconf-pkgconf-2.5.1
          ./autogen.sh && ./configure --disable-shared && make -j4
          sudo make install
          sudo ln -s /usr/local/bin/pkgconf /usr/local/bin/pkg-config
      - name: Install GNU Texinfo
        run: |
          curl $CURL_OPTS -O https://ftpmirror.gnu.org/gnu/texinfo/texinfo-7.3.tar.xz
          tar -Jxf texinfo-7.3.tar.xz && cd texinfo-7.3
          ./configure && make -j4
          sudo make install
      - name: Install GNU Libiconv
        run: |
          curl $CURL_OPTS -O https://ftpmirror.gnu.org/gnu/libiconv/libiconv-1.19.tar.gz
          tar -zxf libiconv-1.19.tar.gz && cd libiconv-1.19
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install GNU Libunistring
        run: |
          curl $CURL_OPTS -O https://ftpmirror.gnu.org/gnu/libunistring/libunistring-1.4.2.tar.xz
          tar -Jxf libunistring-1.4.2.tar.xz && cd libunistring-1.4.2
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install GNU Gettext
        run: |
          curl $CURL_OPTS -O https://ftpmirror.gnu.org/gnu/gettext/gettext-0.26.tar.xz
          tar -Jxf gettext-0.26.tar.xz && cd gettext-0.26
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install GNU Ncurses
        run: |
          curl $CURL_OPTS -O https://ftpmirror.gnu.org/gnu/ncurses/ncurses-6.6.tar.gz
          tar -zxf ncurses-6.6.tar.gz && cd ncurses-6.6
          ./configure --disable-shared \
                     --with-terminfo-dirs=/usr/share/terminfo:/usr/local/share/terminfo \
            && make -j4
          sudo make install
          sudo ln -s /usr/local/include/ncursesw/curses.h /usr/local/include/ncurses.h
      - name: Install Zlib
        run: |
          curl $CURL_OPTS -O https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.xz
          tar -Jxf zlib-1.3.2.tar.xz && cd zlib-1.3.2
          ./configure --static && make -j4
          sudo make install
      - name: Install Libwebp
        run: |
          curl $CURL_OPTS -O https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-1.6.0.tar.gz
          tar -zxf libwebp-1.6.0.tar.gz && cd libwebp-1.6.0
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install Libxml2
        run: |
          curl $CURL_OPTS -O https://download.gnome.org/sources/libxml2/2.15/libxml2-2.15.2.tar.xz
          tar -Jxf libxml2-2.15.2.tar.xz && cd libxml2-2.15.2
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install GNU Libgmp
        run: |
          curl $CURL_OPTS -O https://ftpmirror.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz
          tar -Jxf gmp-6.3.0.tar.xz && cd gmp-6.3.0
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install Libnettle
        run: |
          curl $CURL_OPTS -O https://ftpmirror.gnu.org/gnu/nettle/nettle-3.10.2.tar.gz
          tar -zxf nettle-3.10.2.tar.gz && cd nettle-3.10.2
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install Libidn2
        run: |
          curl $CURL_OPTS -O https://ftpmirror.gnu.org/gnu/libidn/libidn2-2.3.8.tar.gz
          tar -zxf libidn2-2.3.8.tar.gz && cd libidn2-2.3.8
          ./configure --disable-shared && make -j4
          sudo make install
      - name: Install GnuTLS
        run: |
          curl $CURL_OPTS -O https://www.gnupg.org/ftp/gcrypt/gnutls/v3.8/gnutls-3.8.12.tar.xz
          tar -Jxf gnutls-3.8.12.tar.xz && cd gnutls-3.8.12
          ./configure --disable-shared --with-included-libtasn1 --without-p11-kit && make -j4
          sudo make install
      - name: Install Libtreesitter
        run: |
          curl $CURL_OPTS -O https://github.com/tree-sitter/tree-sitter/archive/refs/tags/v0.25.10.tar.gz
          tar -zxf v0.25.10.tar.gz && cd tree-sitter-0.25.10
          make -j4
          sudo make install
          sudo find /usr/local/lib -name 'libtree-sitter*.dylib' -delete
      - name: Install GNU Gzip
        run: |
          curl $CURL_OPTS -O https://ftpmirror.gnu.org/gnu/gzip/gzip-1.14.tar.xz
          tar -Jxf gzip-1.14.tar.xz && cd gzip-1.14
          ./configure && make -j4
          sudo make install
      - name: Build Emacs
        run: |
          source "$GITHUB_WORKSPACE/scripts/emacs-source.sh"
          source "$GITHUB_WORKSPACE/scripts/emacs-patches.sh"
          source "$GITHUB_WORKSPACE/scripts/emacs-configure.sh"
          source "$GITHUB_WORKSPACE/scripts/emacs-sign.sh"
          emacs_prepare_source "$GITHUB_WORKSPACE/$EMACS_SOURCE_DIR"
          cd "$GITHUB_WORKSPACE/$EMACS_SOURCE_DIR"
          # Fixed, vendored emacs-plus/local UI patch set.  Same ordered,
          # SHA-256-verified, strict -F0 application as scripts/build.sh; no
          # patch is downloaded and no wildcard/app cache is consulted.
          emacs_apply_patches "$GITHUB_WORKSPACE/$EMACS_SOURCE_DIR"
          sed -i '' '/darwin/ s/lncurses/lncursesw/g' configure.ac
          ./autogen.sh && emacs_configure
          make -j4
          make install
          ditto nextstep/Emacs.app Emacs.app
          emacs_mark_output Emacs.app
          emacs_mark_patches Emacs.app
          emacs_mark_configuration Emacs.app
          emacs_sign_bundle Emacs.app
          tar -Jcf "$EMACS_ARTIFACT" Emacs.app
      - name: Update release tag
        run: |
          git tag -f "$EMACS_RELEASE_TAG"
          git push origin "$EMACS_RELEASE_TAG" --force
      - name: Release Emacs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.EMACS_RELEASE_TAG }}
          name: ${{ env.EMACS_RELEASE_NAME }}
          files: ${{ env.EMACS_SOURCE_DIR }}/${{ env.EMACS_ARTIFACT }}
          make_latest: true
