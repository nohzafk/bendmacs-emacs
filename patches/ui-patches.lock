# Ordered UI patch set for the pinned GNU Emacs 31 snapshot.
#
# scripts/emacs-patches.sh verifies each SHA-256 below and applies the entries
# in this exact order -- the same code path is used by the local build
# (scripts/build.sh) and by CI (.github/workflows/build.yml).  Paths are
# relative to this file (patches/).  Nothing is downloaded and no wildcard or
# $WORK cache is consulted: only the entries listed here are applied.
#
# Provenance:
#   emacs-31/{system-appearance,round-undecorated-frame,fix-ns-x-colors,fix-ns-scroll-crash}.patch
#       d12frosted/homebrew-emacs-plus@6489a284d333119a05c9b0c2175bedf68250d160
#       (system-appearance rebased to the pinned revision: the two hunks that
#        need the pinned "Sleep event notification" context are re-anchored;
#        the added code is unchanged.)
#   no-frame-refocus-cocoa.patch
#       Local patch, adapted from the emacs-plus emacs-28 no-frame-refocus
#       patch and rebased to the pinned delete_frame fallback block.
#   emacs-31/native-xwidget.patch
#       Local patch, written against the pinned revision: a `native' xwidget
#       type (NS only) whose NSView a dynamic module supplies.  Touches only
#       src/xwidget.c, src/nsxwidget.m and src/nsxwidget.h, which no other
#       patch here touches.
#   emacs-31/ns-xwidget-scroll.patch
#       Local patch, written against the pinned revision with every patch
#       above applied: ns_scroll_run moves xwidget views as x_scroll_run's
#       HAVE_XWIDGETS branch does.  Touches only src/nsterm.m, in the
#       ns_scroll_run that fix-ns-scroll-crash changes, so it is applied
#       after that patch.
#
# The obsolete emacs-28 fix-window-role patch is intentionally NOT listed: the
# pinned source already returns NSAccessibilityWindowRole, so applying it would
# be wrong (it would fail forward and would reverse an upstream fix).
#
# <sha256><TAB><path>
